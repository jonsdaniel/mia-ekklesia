name: Deploy Mia Ekklesia to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare paths for GitHub Pages
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { extname, join } from "node:path";

          const root = "dist/client";
          const prefix = "/mia-ekklesia";
          const pathRoots = [
            "assets",
            "doctrines",
            "miracles",
            "questions",
            "method"
          ];

          async function processDirectory(directory) {
            const entries = await readdir(directory, {
              withFileTypes: true
            });

            for (const entry of entries) {
              const file = join(directory, entry.name);

              if (entry.isDirectory()) {
                await processDirectory(file);
                continue;
              }

              if (![".html", ".js"].includes(extname(file))) {
                continue;
              }

              let source = await readFile(file, "utf8");

              for (const pathRoot of pathRoots) {
                for (const quote of ['"', "'", "`"]) {
                  source = source.replaceAll(
                    `${quote}/${pathRoot}`,
                    `${quote}${prefix}/${pathRoot}`
                  );
                }
              }

              source = source.replaceAll(
                'href="/"',
                `href="${prefix}/"`
              );

              source = source.replace(
                'const parts = window.location.pathname.split("/").filter(Boolean);',
                'const parts = window.location.pathname.replace(/^\\/mia-ekklesia(?=\\/|$)/, "").split("/").filter(Boolean);'
              );

              source = source.replaceAll(
                "https://upon-this-rock.jonsdaniel.chatgpt.site/og.png",
                "https://jonsdaniel.github.io/mia-ekklesia/og.png"
              );

              await writeFile(file, source);
            }
          }

          await processDirectory(root);
          await writeFile(join(root, ".nojekyll"), "");
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
